<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COBOL Tester - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #FAFAFA; --card: #FFFFFF; --text: #1A1A1A; --text-3: #666;
            --text-muted: #888; --border: #E5E7EB; --green: #00C853; --danger: #E53935;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
               min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
                      padding: 40px; width: 100%; max-width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .login-header { text-align: center; margin-bottom: 28px; }
        .login-header img { height: 34px; margin-bottom: 16px; }
        .login-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .login-header .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-3);
                margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 6px;
                font-size: 14px; font-family: inherit; margin-bottom: 16px; }
        input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(0,200,83,0.1); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #1A1A1A;
               color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s; }
        .btn:hover { background: #333; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .erro { background: #FEF2F2; border: 1px solid var(--danger); color: #991B1B;
                padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
        .footer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 24px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="/static/logobrq.png" alt="BRQ">
            <h1>COBOL Tester</h1>
            <div class="sub">Acesso restrito | Prodesp</div>
        </div>
        <div class="erro" id="erro"></div>
        <form id="login-form" onsubmit="return fazerLogin(event)">
            <label for="username">Usuario</label>
            <input type="text" id="username" autocomplete="username" autofocus required>
            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" required>
            <button class="btn" type="submit" id="btn-entrar">Entrar</button>
        </form>
        <div class="footer">BRQ Digital Solutions &copy; 2026</div>
    </div>
    <script>
        async function fazerLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-entrar');
            const erro = document.getElementById('erro');
            erro.style.display = 'none';
            btn.disabled = true; btn.textContent = 'Entrando...';
            try {
                const r = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        senha: document.getElementById('senha').value
                    })
                });
                const d = await r.json();
                if (r.ok && d.ok) {
                    window.location.href = d.must_change_password ? '/trocar-senha' : '/';
                } else {
                    erro.textContent = d.error || 'Falha no login';
                    erro.style.display = 'block';
                }
            } catch (err) {
                erro.textContent = 'Erro de conexao: ' + err.message;
                erro.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = 'Entrar';
            }
            return false;
        }
    </script>
</body>
</html>
